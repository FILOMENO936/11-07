<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Landing Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #333;
            overflow-x: hidden;
        }
        header {
            background-color: rgba(252, 228, 225, 0.9);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #c29997;
            font-weight: bold;
        }
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: #fce4ec;
            position: relative;
            overflow: hidden;
        }
        .hero h1 {
            font-size: 3em;
            color: #b67c78;
            animation: fadeIn 2s;
        }
        .cta {
            margin-top: 20px;
        }
        .cta button {
            background-color: #e09bb1;
            border: none;
            padding: 10px 20px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.3s;
        }
        .cta button:hover {
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2em;
            }
            .cta button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Valentine's Day</div>
        <nav>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Happy Valentine's Day!</h1>
        <div class="cta">
            <button onclick="document.getElementById('about').scrollIntoView();">Learn More</button>
        </div>
    </section>
    <section id="about">
        <h2>About Our Services</h2>
        <p>Explore our romantic offerings designed for you.</p>
    </section>
    <section id="services">
        <h2>Services</h2>
        <p>We provide special services for this love season.</p>
    </section>
    <section id="contact">
        <h2>Contact Us</h2>
        <p>Get in touch with us to know more.</p>
    </section>
</body>
</html>
